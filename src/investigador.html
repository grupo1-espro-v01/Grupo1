<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Investigador — FGR</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="icon-shield">🛡️</div>
    <span>Panel de Investigador</span>
  </div>
  <div class="topbar-user">
    <div>
      <div class="user-name" id="topbar-nombre">—</div>
      <div class="user-role">Investigador</div>
    </div>
    <button class="btn-logout" onclick="window.Auth.logout()">⬅ Salir</button>
  </div>
</div>

<div class="page-content" style="max-width: 1100px; margin: 0 auto; padding: 30px 20px;">

  <h2 style="margin-bottom: 8px;">Mis Casos Asignados</h2>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Solo aparecen los casos que te han sido asignados por el administrador.</p>

  <div id="lista-casos"></div>

</div>

<!-- MODAL DETALLE -->
<div id="modal-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:28px;max-width:780px;width:95%;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.25);">
    
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <span style="font-weight:700;font-size:18px;color:var(--navy);" id="modal-titulo">Detalle del Caso</span>
      <button onclick="cerrarModal()" style="background:none;border:none;font-size:24px;cursor:pointer;">✕</button>
    </div>

    <div id="modal-body"></div>

    <!-- NOTAS PRIVADAS -->
    <div style="margin-top:32px;">
      <h4 style="margin-bottom:12px;">📝 Notas Privadas del Investigador</h4>
      <div id="notas-container" style="margin-bottom:16px; max-height:220px; overflow-y:auto;"></div>

      <div style="display:flex;gap:10px;">
        <textarea id="nueva-nota" class="form-control" rows="3" placeholder="Escribe una nota privada..."></textarea>
        <button onclick="agregarNota()" class="btn btn-primary" style="height:fit-content; white-space:nowrap;">Agregar Nota</button>
      </div>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script>
const user = window.Auth.requireLogin(['investigador', 'admin']);
if (user) {
  document.getElementById('topbar-nombre').textContent = user.nombre;
}

let casoActual = null;

// Cargar casos asignados
async function cargarMisCasos() {
  try {
    const misCasos = await Denuncias.misAsignadas();
    const container = document.getElementById('lista-casos');
    container.innerHTML = '';

    if (misCasos.length === 0) {
      container.innerHTML = `<p style="color:var(--text-muted);">No tienes casos asignados actualmente.</p>`;
      return;
    }

    misCasos.forEach(caso => {
      const div = document.createElement('div');
      div.className = 'case-card';
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <strong style="font-size:17px;">${caso.codigo_unico}</strong><br>
            <span style="color:var(--text-muted);">${caso.categoria}</span>
          </div>
          <div>${Utils.estadoBadge(caso.estado)}</div>
        </div>
        <div style="margin:12px 0 16px;">
          <strong>Gravedad:</strong> ${Utils.gravedad(caso.gravedad)}<br>
          <strong>Fecha:</strong> ${Utils.formatFecha(caso.fecha_presentacion)}
        </div>
        <button class="btn btn-primary btn-sm" onclick="verDetalle(${caso.id})">Ver Detalle y Notas</button>
      `;
      container.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    alert('Error al cargar tus casos asignados.');
  }
}

// Ver detalle del caso + evidencias
async function verDetalle(id) {
  try {
    const todas = await Denuncias.listar();
    casoActual = todas.find(d => d.id === id);
    if (!casoActual) return;

    // Cargar evidencias del caso
    let evidenciasHTML = '';
    try {
      const evidencias = await Evidencias.listar(id);
      
      if (evidencias.length > 0) {
        evidenciasHTML = `<div style="margin-top:20px;"><strong>Evidencias:</strong><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;">`;
        
        evidencias.forEach(ev => {
          const esImagen = ['JPG','JPEG','PNG','GIF'].includes(ev.tipo?.toUpperCase());
          
          if (esImagen) {
            evidenciasHTML += `
              <div>
                <a href="${ev.archivo_url}" target="_blank">
                  <img src="${ev.archivo_url}" style="max-width:140px;max-height:140px;border-radius:8px;border:1px solid #ddd;object-fit:cover;">
                </a>
              </div>`;
          } else {
            evidenciasHTML += `
              <div style="padding:10px;border:1px solid #ddd;border-radius:8px;">
                <a href="${ev.archivo_url}" target="_blank" style="color:#C0392B;text-decoration:none;">
                  📄 ${ev.tipo || 'Archivo'} 
                </a>
              </div>`;
          }
        });
        
        evidenciasHTML += `</div></div>`;
      } else {
        evidenciasHTML = `<p style="color:var(--text-muted);margin-top:10px;">Este caso aún no tiene evidencias.</p>`;
      }
    } catch (e) {
      evidenciasHTML = `<p style="color:red;">Error al cargar evidencias.</p>`;
    }

    const modalBody = document.getElementById('modal-body');
    modalBody.innerHTML = `
      <div class="result-box">
        <div class="result-row"><span class="lbl">Código</span><span>${casoActual.codigo_unico}</span></div>
        <div class="result-row"><span class="lbl">Estado</span><span>${Utils.estadoBadge(casoActual.estado)}</span></div>
        <div class="result-row"><span class="lbl">Categoría</span><span>${casoActual.categoria}</span></div>
        <div class="result-row"><span class="lbl">Gravedad</span><span>${Utils.gravedad(casoActual.gravedad)}</span></div>
        <div class="result-row"><span class="lbl">Fecha</span><span>${Utils.formatFecha(casoActual.fecha_presentacion)}</span></div>
        
        <div style="margin-top:16px;">
          <div style="font-weight:600;margin-bottom:6px;">Descripción</div>
          <div style="background:#f8f9fa;padding:12px;border-radius:8px;white-space:pre-wrap;">${casoActual.descripcion}</div>
        </div>

        ${evidenciasHTML}
      </div>
    `;

    document.getElementById('modal-overlay').classList.remove('hidden');
    await cargarNotas(id);

  } catch (err) {
    console.error(err);
    alert('Error al cargar el detalle del caso.');
  }
}

function cerrarModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  casoActual = null;
}

// Cargar notas reales desde el backend
async function cargarNotas(denuncia_id) {
  try {
    const notas = await fetch(`https://grupo1-production-a2cc.up.railway.app/api/comentarios/${denuncia_id}`, {
      headers: { 'Authorization': `Bearer ${Auth.token()}` }
    }).then(r => r.json());

    const container = document.getElementById('notas-container');
    container.innerHTML = '';

    if (notas.length === 0) {
      container.innerHTML = `<p style="color:var(--text-muted);font-size:13px;">Aún no hay notas en este caso.</p>`;
      return;
    }

    notas.forEach(nota => {
      const div = document.createElement('div');
      div.className = 'note';
      div.innerHTML = `
        <div style="font-size:12px;color:#666;margin-bottom:4px;">
          <strong>${nota.nombre || 'Investigador'}</strong> • ${new Date(nota.fecha_creacion).toLocaleString('es-SV')}
        </div>
        <div>${nota.texto}</div>
      `;
      container.appendChild(div);
    });

  } catch (err) {
    console.error(err);
  }
}

// Agregar nota real
async function agregarNota() {
  const texto = document.getElementById('nueva-nota').value.trim();
  if (!texto || !casoActual) return;

  try {
    await fetch('https://grupo1-production-a2cc.up.railway.app/api/comentarios', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${Auth.token()}`
      },
      body: JSON.stringify({
        denuncia_id: casoActual.id,
        texto: texto,
        tipo: 'nota_investigador'
      })
    });

    document.getElementById('nueva-nota').value = '';
    await cargarNotas(casoActual.id); // recargar notas

  } catch (err) {
    alert('Error al guardar la nota.');
    console.error(err);
  }
}

// Cargar al iniciar
cargarMisCasos();
</script>

</body>
</html>
