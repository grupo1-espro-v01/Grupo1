<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Investigador — FGR</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .case-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .note {
      background: #f8f9fa;
      border-left: 4px solid var(--navy);
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="icon-shield">🛡️</div>
    <span>Panel de Investigador</span>
  </div>
  <div class="topbar-user">
    <div>
      <div class="user-name" id="topbar-nombre">—</div>
      <div class="user-role">Investigador</div>
    </div>
    <button class="btn-logout" onclick="window.Auth.logout()">⬅ Salir</button>
  </div>
</div>

<div class="page-content" style="max-width: 1100px; margin: 0 auto; padding: 30px 20px;">

  <h2 style="margin-bottom: 8px;">Mis Casos Asignados</h2>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Aquí aparecen solo los casos que te han sido asignados.</p>

  <div id="lista-casos">
    <!-- Se carga dinámicamente con JS -->
  </div>

</div>

<!-- MODAL DETALLE DEL CASO -->
<div id="modal-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:28px;max-width:720px;width:95%;max-height:85vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.25);">
    
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <span style="font-weight:700;font-size:18px;color:var(--navy);" id="modal-titulo">Detalle del Caso</span>
      <button onclick="cerrarModal()" style="background:none;border:none;font-size:22px;cursor:pointer;">✕</button>
    </div>

    <div id="modal-body">
      <!-- Contenido dinámico -->
    </div>

    <!-- Notas del investigador -->
    <div style="margin-top:30px;">
      <h4 style="margin-bottom:12px;">📝 Notas Privadas</h4>
      <div id="notas-container" style="margin-bottom:16px;"></div>

      <div style="display:flex;gap:10px;">
        <textarea id="nueva-nota" class="form-control" rows="3" placeholder="Escribe una nota privada..."></textarea>
        <button onclick="agregarNota()" class="btn btn-primary" style="height:fit-content;">Agregar Nota</button>
      </div>
    </div>

    <!-- Subir evidencia privada -->
    <div style="margin-top:30px;">
      <h4 style="margin-bottom:12px;">📎 Subir Evidencia Privada</h4>
      <input type="file" id="evidencia-privada" class="form-control">
      <button onclick="subirEvidenciaPrivada()" class="btn btn-outline mt-md">Subir Evidencia</button>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script>
const user = window.Auth.requireLogin(['investigador', 'admin']);
if (user) {
  document.getElementById('topbar-nombre').textContent = user.nombre;
}

let casoActual = null;

// Cargar casos asignados al investigador
async function cargarMisCasos() {
  try {
    const denuncias = await Denuncias.listar();
    // Filtramos solo los casos asignados a este investigador
    // (Por ahora filtramos en frontend. Idealmente se haría en backend)
    const misCasos = denuncias.filter(d => d.investigador_id === user.id);

    const container = document.getElementById('lista-casos');
    container.innerHTML = '';

    if (misCasos.length === 0) {
      container.innerHTML = `<p style="color:var(--text-muted);">No tienes casos asignados actualmente.</p>`;
      return;
    }

    misCasos.forEach(caso => {
      const div = document.createElement('div');
      div.className = 'case-card';
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <strong style="font-size:17px;">${caso.codigo_unico}</strong><br>
            <span style="color:var(--text-muted);">${caso.categoria}</span>
          </div>
          <div>${Utils.estadoBadge(caso.estado)}</div>
        </div>
        <div style="margin:12px 0;">
          <strong>Gravedad:</strong> ${Utils.gravedad(caso.gravedad)}<br>
          <strong>Fecha:</strong> ${Utils.formatFecha(caso.fecha_presentacion)}
        </div>
        <button class="btn btn-primary btn-sm" onclick="verDetalle(${caso.id})">Ver Detalle</button>
      `;
      container.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    alert('Error al cargar tus casos.');
  }
}

// Ver detalle del caso
async function verDetalle(id) {
  try {
    const denuncias = await Denuncias.listar();
    casoActual = denuncias.find(d => d.id === id);
    if (!casoActual) return;

    const modalBody = document.getElementById('modal-body');
    modalBody.innerHTML = `
      <div class="result-box">
        <div class="result-row"><span class="lbl">Código</span><span>${casoActual.codigo_unico}</span></div>
        <div class="result-row"><span class="lbl">Estado</span><span>${Utils.estadoBadge(casoActual.estado)}</span></div>
        <div class="result-row"><span class="lbl">Categoría</span><span>${casoActual.categoria}</span></div>
        <div class="result-row"><span class="lbl">Gravedad</span><span>${Utils.gravedad(casoActual.gravedad)}</span></div>
        <div class="result-row"><span class="lbl">Fecha</span><span>${Utils.formatFecha(casoActual.fecha_presentacion)}</span></div>
        <div style="margin-top:16px;">
          <div style="font-weight:600;margin-bottom:6px;">Descripción</div>
          <div style="background:#f8f9fa;padding:12px;border-radius:8px;">${casoActual.descripcion}</div>
        </div>
      </div>
    `;

    document.getElementById('modal-overlay').classList.remove('hidden');
    cargarNotas(id);

  } catch (err) {
    console.error(err);
  }
}

function cerrarModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  casoActual = null;
}

// Cargar notas del caso
async function cargarNotas(denuncia_id) {
  // Por ahora mostramos notas de ejemplo. 
  // Más adelante conectamos con el backend real de comentarios.
  const container = document.getElementById('notas-container');
  container.innerHTML = `<p style="color:var(--text-muted);font-size:13px;">(Aquí aparecerán tus notas privadas)</p>`;
}

// Agregar nota privada
async function agregarNota() {
  const texto = document.getElementById('nueva-nota').value.trim();
  if (!texto || !casoActual) return;

  // TODO: Aquí deberíamos llamar a un endpoint real de comentarios
  alert('Nota agregada (simulación). En la versión final se guardará en la base de datos.');

  document.getElementById('nueva-nota').value = '';
  // Recargamos notas (simulado)
  cargarNotas(casoActual.id);
}

// Subir evidencia privada (simulado por ahora)
async function subirEvidenciaPrivada() {
  const input = document.getElementById('evidencia-privada');
  if (!input.files.length || !casoActual) {
    alert('Selecciona un archivo.');
    return;
  }

  alert('Evidencia privada subida (simulación). En producción se marca como privada.');
  input.value = '';
}

// Cargar al iniciar
cargarMisCasos();
</script>

</body>
</html>
